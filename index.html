<style>

button{cursor:pointer}button.save-ok{font-weight:700;box-shadow:0 0 0 2px rgba(46,125,50,.18) inset}button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}button.danger{color:#9d1c1c}
button.bigctl{box-sizing:border-box;-webkit-appearance:none;appearance:none;font:inherit;line-height:normal;width:calc(38px * var(--menu-scale));min-width:calc(38px * var(--menu-scale));max-width:calc(38px * var(--menu-scale));height:auto;min-height:0;max-height:none;padding:calc(7px * var(--menu-scale)) 0;margin:0;font-weight:600;display:inline-flex;flex:0 0 calc(38px * var(--menu-scale));align-items:center;justify-content:center;vertical-align:middle}button.bigctl:focus{outline:auto}
label.inline{display:flex;align-items:center;gap:calc(5px * var(--menu-scale));font-size:calc(13px * var(--menu-scale))}.status{font-size:calc(12px * var(--menu-scale));white-space:pre-wrap;word-break:break-word}.messages-panel{width:100%;background:#fff;border:1px solid #cfd4da;border-radius:7px;overflow:hidden}.messages-title{cursor:pointer;display:block;padding:calc(6px * var(--menu-scale)) calc(8px * var(--menu-scale));font-size:calc(11px * var(--menu-scale));font-weight:700;color:#65707c;text-transform:uppercase;letter-spacing:.04em;user-select:none}.messages-panel[open] .messages-title{border-bottom:1px solid #e2e5e8}.messages-panel .status{max-height:calc(110px * var(--menu-scale));overflow:auto;padding:calc(7px * var(--menu-scale)) calc(8px * var(--menu-scale))}.debug-footer{padding:0 18px 18px;width:100%}
.navbar{display:flex;align-items:center;gap:calc(5px * var(--menu-scale))}.pair{display:inline-flex;flex-wrap:nowrap;align-items:center}.navbar.nav-disabled{opacity:.55}.navbar.nav-disabled button,.navbar.nav-disabled input{pointer-events:none}.pair{display:flex;gap:calc(3px * var(--menu-scale));align-items:center}.sep{width:1px;align-self:stretch;min-height:calc(28px * var(--menu-scale));background:#cfd4da;margin:0 calc(5px * var(--menu-scale));flex:0 0 1px}.menuval{font-size:calc(12px * var(--menu-scale));min-width:calc(40px * var(--menu-scale));text-align:center}
#pageNumber{width:calc(54px * var(--menu-scale));text-align:center}.zoomval{font-size:calc(12px * var(--menu-scale));min-width:calc(42px * var(--menu-scale));text-align:center}.stage{padding:18px;display:block;width:100%;max-width:100vw;overflow-x:auto;overflow-y:visible;scrollbar-width:none}.stage::-webkit-scrollbar{height:0}.horizontal-scrollbar{position:fixed;left:0;right:0;bottom:0;height:17px;overflow-x:auto;overflow-y:hidden;z-index:90;background:#eef1f4;border-top:1px solid #cfd4da;display:none}.horizontal-scrollbar-inner{height:1px}.horizontal-scrollbar.visible{display:block}body.has-horizontal-scrollbar{padding-bottom:17px}.viewport{position:relative;margin-left:auto;margin-right:auto}.pageSurface{position:absolute;left:0;top:0;transform-origin:top left;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.22);overflow:hidden;isolation:isolate;contain:paint;backface-visibility:hidden}
#pdfCanvas{position:absolute;left:0;top:0;width:100%;height:100%;z-index:1}.overlay{position:absolute;left:0;top:0;width:100%;height:100%;z-index:2}
.field{position:absolute;box-sizing:border-box;color:#111;background:rgba(35,135,210,.14);border:0;padding:1px 2px;outline:none;border-radius:1px;z-index:4;resize:none;overflow:hidden;white-space:pre-wrap}
.field:focus{background:#fff}.field.selected{outline:0;box-shadow:none;background:rgba(35,135,210,.14)}
body.adjust .field{cursor:move;outline:0;box-shadow:none;background:rgba(35,135,210,.14);user-select:none}body.adjust .field.selected,body.adjust .field.dragging{outline:0;box-shadow:none;background:rgba(35,135,210,.26)}body.clean .field{border-color:transparent!important;background:transparent!important;outline:0!important;box-shadow:none!important}body.clean .field.selected{outline:0!important;box-shadow:none!important}.field.dragging{will-change:left,top;backface-visibility:hidden}
.field-text-layer{position:absolute;pointer-events:none;z-index:6;box-sizing:border-box;overflow:visible;white-space:pre-wrap;word-break:break-word;line-height:1.2;background:transparent}.field.mirrored:not(:focus){color:transparent!important}.field:focus + .field-text-layer{display:none}body.clean .field-text-layer{display:block}
.box-char-layer{position:absolute;pointer-events:none;z-index:6;color:#111;overflow:visible}.box-char{position:absolute;top:0;height:100%;display:flex;align-items:center;justify-content:center;white-space:pre;line-height:1}.box-caret{position:absolute;width:1px;pointer-events:none;background:currentColor;animation:boxCaretBlink 1s steps(1,end) infinite}@keyframes boxCaretBlink{0%,49%{opacity:1}50%,100%{opacity:0}}.box-guide{position:absolute;top:0;height:100%;box-sizing:border-box;border:0;background:transparent;pointer-events:none;display:none}body.adjust .box-guide{display:block;background:rgba(35,135,210,.12)}.field.box-detected{color:transparent;caret-color:transparent;background:rgba(35,135,210,.12)}.field.box-detected::selection{background:rgba(200,0,0,.12);color:transparent}body.adjust .field.box-detected{outline:0;box-shadow:none;background:rgba(35,135,210,.12)}body.adjust .field.box-detected.selected{outline:0;box-shadow:none;background:rgba(35,135,210,.24)}.field.box-detected.selected{outline:0;box-shadow:none;background:rgba(35,135,210,.12)}body.adjust .box-char-layer{pointer-events:none}body.clean .box-char-layer{color:#111}body.clean .box-guide{display:none!important}body.clean .field.box-detected{border-color:transparent!important;background:transparent!important;box-shadow:none!important}
.line-guide-layer{position:absolute;pointer-events:none;z-index:6}.line-guide{position:absolute;height:0;border-top:1px dashed #1687a7;pointer-events:none}.field.line-detected{background:rgba(22,135,167,.025)}body.clean .line-guide-layer{display:none!important}body.clean .field.line-detected{background:transparent!important}
.text-resize{position:absolute;width:6px;height:6px;display:none;cursor:nwse-resize;z-index:8;background:var(--red);border-radius:2px}body.adjust .text-resize{display:block}body.clean .text-resize{display:none!important}
.image-zone{position:absolute;box-sizing:border-box;border:0;background:transparent;z-index:4}.image-zone img{width:100%;height:100%;display:block;object-fit:contain;pointer-events:none}.image-zone::after{content:"";position:absolute;inset:0;pointer-events:none;background:rgba(35,135,210,.14)}.image-zone.selected{outline:0}body.adjust .image-zone{cursor:move;outline:0}body.adjust .image-zone::after{background:rgba(35,135,210,.14)}body.adjust .image-zone.selected::after,body.adjust .image-zone.dragging::after{background:rgba(35,135,210,.26)}body.clean .image-zone::after{display:none}
.image-resize,.mask-resize{position:absolute;width:6px;height:6px;right:-3px;bottom:-3px;display:none;cursor:nwse-resize;z-index:9;background:var(--red);border-radius:2px}body.adjust .image-resize,body.adjust .mask-resize{display:block}body.clean .image-resize,body.clean .mask-resize{display:none!important}
.mask-zone{position:absolute;box-sizing:border-box;background:#fff;border:0;outline:0;z-index:3;pointer-events:none}.mask-zone.selected{border:0;outline:0}body.adjust .mask-zone{border:0;cursor:move;pointer-events:auto;background:linear-gradient(rgba(90,90,90,.18),rgba(90,90,90,.18)),#fff}body.adjust .mask-zone.selected,body.adjust .mask-zone.dragging{border:0;background:linear-gradient(rgba(90,90,90,.30),rgba(90,90,90,.30)),#fff}body.clean .mask-zone{border:0!important;outline:0!important;pointer-events:none!important;background:#fff!important}
.check-zone{position:absolute;box-sizing:border-box;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(35,135,210,.16)}.check-zone input{margin:0;width:100%;height:100%;cursor:pointer}.check-zone.selected{outline:0}body.adjust .check-zone{cursor:move;background:rgba(35,135,210,.16)}body.adjust .check-zone.selected,body.adjust .check-zone.dragging{background:rgba(35,135,210,.30)}body.clean .check-zone{background:transparent!important}.check-resize{position:absolute;width:6px;height:6px;right:-3px;bottom:-3px;display:none;cursor:nwse-resize;z-index:9;background:var(--red);border-radius:2px}body.adjust .check-resize{display:block}.check-zone.check-detected input{-webkit-appearance:none;appearance:none;border:0;background:transparent;outline:0}.check-zone.check-detected .check-mark{display:none;position:absolute;inset:0;pointer-events:none}.check-zone.check-detected.checked .check-mark{display:block}.check-zone.check-detected .check-mark:before,.check-zone.check-detected .check-mark:after{content:"";position:absolute;left:12%;top:47%;width:76%;height:1.6px;background:#111;transform-origin:center}.check-zone.check-detected .check-mark:before{transform:rotate(45deg)}.check-zone.check-detected .check-mark:after{transform:rotate(-45deg)}body.adjust .check-zone.check-detected.selected{outline:0;box-shadow:none;background:rgba(35,135,210,.30)}.check-zone.check-detected input{display:block;box-sizing:border-box;width:100%;height:100%;padding:0;margin:0}.check-zone.check-detected .check-resize{background:#2b8a3e}body.clean .check-zone.selected,body.clean .check-zone.check-detected.selected{outline:0!important;box-shadow:none!important}body.clean .check-resize{display:none!important}
.placement-ghost{position:absolute;z-index:30;pointer-events:none;box-sizing:border-box;border:0;background:rgba(35,135,210,.20);display:none}.placement-ghost.check{border-radius:2px}.placement-ghost.mask{background:linear-gradient(rgba(90,90,90,.22),rgba(90,90,90,.22)),rgba(255,255,255,.92)}.placement-ghost.image{background:rgba(35,135,210,.16)}
.empty{padding:60px 20px;text-align:center;color:#666}
.toolbar-top{display:flex;justify-content:space-between;align-items:center;min-height:calc(28px * var(--menu-scale));padding:0 calc(2px * var(--menu-scale));gap:calc(8px * var(--menu-scale))}
.app-heading{display:flex;align-items:baseline;gap:calc(8px * var(--menu-scale));min-width:0;color:#65707c}
.app-name{font-size:calc(16px * var(--menu-scale));font-weight:700;line-height:1;white-space:nowrap}
.app-name-link{color:inherit;text-decoration:none}.app-name-link:hover{text-decoration:underline}.app-name-link:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:2px}
.app-version{font-size:calc(12px * var(--menu-scale));font-weight:700;opacity:.75;line-height:1;white-space:nowrap}
.toolbar-top-actions{display:flex;align-items:center;gap:calc(12px * var(--menu-scale));margin-left:auto}
.menu-scale-control{display:flex;align-items:center;gap:calc(5px * var(--menu-scale));font-size:calc(12px * var(--menu-scale));font-weight:700;color:#65707c;white-space:nowrap}
.language-switch{display:flex;align-items:center;gap:calc(6px * var(--menu-scale));font-size:calc(12px * var(--menu-scale));font-weight:700;color:#65707c;line-height:1}
.language-switch span{display:inline-flex;align-items:center;line-height:1;padding-top:1px}
.language-switch select{height:calc(30px * var(--menu-scale));padding:calc(3px * var(--menu-scale)) calc(6px * var(--menu-scale));font-size:calc(12px * var(--menu-scale));margin:0}
@media(max-width:700px){.toolbar-top{justify-content:space-between;flex-wrap:wrap}.app-heading{order:1}.toolbar-top-actions{order:2;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}.toolgroup{width:100%}}

/* v73: hors mode réglage, conserver exactement le bleutage des zones éditables.
   Le mode clean (Masquer cadres) reste le seul mode qui retire le bleutage. */
body:not(.adjust):not(.clean) .field,
body:not(.adjust):not(.clean) .field.line-detected,
body:not(.adjust):not(.clean) .field.box-detected {
  background:rgba(35,135,210,.14)!important;
}
body:not(.adjust):not(.clean) .check-zone {
  background:rgba(35,135,210,.16)!important;
}
body:not(.adjust):not(.clean) .image-zone::after {
  display:block!important;
  background:rgba(35,135,210,.14)!important;
}
body:not(.adjust) .text-resize,
body:not(.adjust) .check-resize,
body:not(.adjust) .image-resize,
body:not(.adjust) .mask-resize {
  display:none!important;
}

/* v81: le bleutage suit la ligne de base détectée au lieu d'être simplement aminci.
   --blue-top/--blue-bottom sont calculés par JS pour que le ruban se termine sur
   la ligne détectée et remonte d'une hauteur cohérente avec la taille du texte. */
.field,
.field.selected,
body.adjust .field,
body:not(.adjust):not(.clean) .field,
body:not(.adjust):not(.clean) .field.line-detected,
body:not(.adjust):not(.clean) .field.box-detected,
body.adjust .field.box-detected,
body.adjust .field.box-detected.selected,
.field.box-detected,
.field.box-detected.selected {
  --blue-top:18%;
  --blue-bottom:88%;
  background:linear-gradient(to bottom,
    transparent 0 var(--blue-top),
    rgba(35,135,210,.14) var(--blue-top) var(--blue-bottom),
    transparent var(--blue-bottom) 100%)!important;
}
body.adjust .field.selected,
body.adjust .field.dragging,
body.adjust .field.box-detected.selected {
  background:linear-gradient(to bottom,
    transparent 0 var(--blue-top),
    rgba(35,135,210,.26) var(--blue-top) var(--blue-bottom),
    transparent var(--blue-bottom) 100%)!important;
}
.field:focus {
  background:#fff!important;
}
body.clean .field,
body.clean .field.line-detected,
body.clean .field.box-detected {
  background:transparent!important;
}
body.adjust .box-guide {
  top:var(--blue-top,18%);
  height:calc(var(--blue-bottom,88%) - var(--blue-top,18%));
  /* Le champ porte déjà le bleutage. Garder les guides transparents évite
     les arêtes verticales artificielles entre cellules détectées. */
  background:transparent;
}

/* v86 : Dark Reader reste libre d'assombrir l'interface.
   On corrige uniquement le texte des zones PDF afin qu'il reste lisible sur
   la page blanche. Dark Reader marque <html> avec data-darkreader-scheme. */
html[data-darkreader-scheme="dark"] .field:not(.box-detected),
html[data-darkreader-scheme="dark"] .field-text-layer,
html[data-darkreader-scheme="dark"] .box-char-layer,
html[data-darkreader-scheme="dark"] .box-char {
  -webkit-text-fill-color:#111!important;
  color:#111!important;
}
html[data-darkreader-scheme="dark"] .field { caret-color:#111!important; }
html[data-darkreader-scheme="dark"] .field.box-detected {
  -webkit-text-fill-color:transparent!important;
  color:transparent!important;
  caret-color:transparent!important;
}
/* v93 : organisation de la barre d’outils. */
.edit-group{display:block}
.edit-section{display:block;width:100%;padding:0;background:transparent;border:0}
.edit-tabs{display:flex;gap:calc(2px * var(--menu-scale));align-items:flex-end;margin:0;padding:0 calc(8px * var(--menu-scale));border-bottom:2px solid #8f9aa5}
.edit-tab-button{position:relative;margin:0 0 -2px 0;border:1px solid #9da7b2;border-bottom:2px solid #8f9aa5;border-radius:calc(8px * var(--menu-scale)) calc(8px * var(--menu-scale)) 0 0;background:#e9edf1;color:#39434d;padding:calc(9px * var(--menu-scale)) calc(18px * var(--menu-scale));font-weight:700;box-shadow:none}
.edit-tab-button:hover{background:#f3f5f7;border-color:#7f8b97}
.edit-tab-button.active{z-index:2;background:#fff;color:#1f2933;border-color:#8f9aa5;border-bottom:2px solid #fff;box-shadow:0 -1px 2px rgba(0,0,0,.06)}
.edit-tab-panel{display:none;flex-wrap:wrap;gap:calc(6px * var(--menu-scale));align-items:center;width:100%;padding:calc(10px * var(--menu-scale)) calc(8px * var(--menu-scale));background:#fff;border:1px solid #cfd4da;border-top:0;border-radius:0 0 7px 7px}
.edit-tab-panel.active{display:flex}
.align-icon-button{width:calc(34px * var(--menu-scale));height:calc(30px * var(--menu-scale));padding:calc(5px * var(--menu-scale));display:inline-flex;align-items:center;justify-content:center}
.align-icon{display:flex;flex-direction:column;justify-content:center;gap:calc(2px * var(--menu-scale));width:calc(18px * var(--menu-scale));height:calc(16px * var(--menu-scale))}
.align-icon i{display:block;height:calc(2px * var(--menu-scale));background:currentColor;border-radius:1px}
.align-icon i:nth-child(1){width:100%}.align-icon i:nth-child(2){width:72%}.align-icon i:nth-child(3){width:88%}
.align-icon.align-left{align-items:flex-start}.align-icon.align-center{align-items:center}.align-icon.align-right{align-items:flex-end}
.subsection-label{font-size:calc(12px * var(--menu-scale));font-weight:700;color:#65707c;margin-left:calc(3px * var(--menu-scale));white-space:nowrap}
.font-size-setting{display:flex;align-items:center;gap:calc(5px * var(--menu-scale));font-size:calc(13px * var(--menu-scale))}
.font-size-control{display:flex;align-items:center;gap:calc(3px * var(--menu-scale))}
#fontSize{width:68px;text-align:center;-moz-appearance:textfield;appearance:textfield}
#fontSize::-webkit-inner-spin-button,#fontSize::-webkit-outer-spin-button{-webkit-appearance:none;appearance:none;margin:0}

/* v93 : verrou uniquement sur le texte du PDF ; l'interface reste gérée par Dark Reader. */
.field[data-darkreader-lock], .field-text-layer[data-darkreader-lock], .box-char-layer[data-darkreader-lock], .box-char[data-darkreader-lock], .box-caret[data-darkreader-lock]{forced-color-adjust:none}

/* Detected checkboxes use the same native browser rendering as ordinary checkboxes.
   Detection still controls geometry/snap only; it no longer switches to a second visual renderer. */
.check-zone.check-detected input{
  -webkit-appearance:auto!important;
  appearance:auto!important;
  display:block!important;
  box-sizing:border-box;
  width:100%!important;
  height:100%!important;
  min-width:0!important;
  min-height:0!important;
  padding:0!important;
  margin:0!important;
  opacity:1!important;
  visibility:visible!important;
}
.check-zone.check-detected .check-mark{display:none!important}
/* Same resize handle as an ordinary checkbox: detected/non-detected now differ only in snap metadata. */
.check-zone.check-detected .check-resize{background:var(--red)!important}
</style>

<body>
<div class="toolbar">
  <div class="toolbar-top">
    <div class="app-heading"><a class="app-name app-name-link" href="https://github.com/nicklausFR/pdf-field-helper" target="_blank" rel="noopener noreferrer" title="GitHub — PDF Field Helper">PDF Field Helper</a><span class="app-version">v1.2</span></div>
    <div class="toolbar-top-actions">
      <div class="menu-scale-control">
        <span id="menuLabel">Menu</span>
        <div class="pair"><button id="menuSmaller" class="bigctl" title="Reduce menu size">−</button><button id="menuLarger" class="bigctl" title="Increase menu size">+</button></div>
        <span id="menuPercent" class="menuval">100%</span>
      </div>
      <div class="language-switch"><span id="languageLabel">Language</span><select id="languageSelect" aria-label="Language"><option value="en">ENG</option><option value="fr">FR</option></select></div>
    </div>
  </div>
  <div class="toolgroup">
    <span class="group-title"><span id="documentTitleLabel">Document</span></span>
    <button id="openPdf" class="primary" title="Open a PDF">Open</button>
    <input id="pdfPicker" type="file" accept="application/pdf" hidden>
    <button id="closePdf">Close</button>
    <button id="resetDocument" class="danger">Reset</button>
    <button id="save">Save</button>
    <button id="exportLayout">Save overlay</button>
    <button id="importLayout">Load overlay</button>
    <input id="layoutPicker" type="file" accept="application/json,.json" hidden>
    <button id="clear">Clear values</button>
    <button id="exportPdf" class="primary">Generate PDF</button>
  </div>

  <div class="toolgroup">
    <span class="group-title" id="viewTitleLabel">View</span>
    <button id="toggleClean">Hide frames</button>
    <span class="sep"></span>
    <span id="zoomLabel">Zoom</span>
    <div class="pair"><button id="zoomOut" class="bigctl" title="Zoom out">−</button><button id="zoomIn" class="bigctl" title="Zoom in">+</button></div>
    <span id="zoomPercent" class="zoomval">100%</span>
    <div class="navbar" id="navbar">
      <span class="sep"></span>
      <span id="pagesLabel">Pages</span>
      <div class="pair"><button id="prevPage" class="bigctl" title="Previous page">&lt;&lt;</button><button id="nextPage" class="bigctl" title="Next page">&gt;&gt;</button></div>
      <span id="pageLabel">Page</span><input id="pageNumber" type="number" min="1" value="1"><span>/ <b id="pageCount">0</b></span>
    </div>
  </div>

  <div class="edit-section">
    <div class="edit-tabs" role="tablist" aria-label="Editing">
      <button id="tabLayerButton" class="edit-tab-button active" type="button" role="tab" aria-selected="true" aria-controls="tabLayer">Overlay creation mode</button>
      <button id="tabEditButton" class="edit-tab-button" type="button" role="tab" aria-selected="false" aria-controls="tabEdit">Edit mode</button>
    </div>

    <div id="tabLayer" class="edit-tab-panel active" role="tabpanel" aria-labelledby="tabLayerButton">
      <button id="addField">+ Text</button>
      <button id="addCheck">+ Checkbox</button>
      <button id="addImage">+ Image</button>
      <input id="imagePicker" type="file" accept="image/png,image/jpeg,image/webp" hidden>
      <button id="addMask">+ Mask</button>

function browserBoxTextMetrics(fontFamilyName,size){
  // Mesure la baseline CSS réelle du navigateur pour cette police/taille. Cela reste
  // stable lorsque l'on passe de 8 px à une très grande police et entre Helvetica,
  // Times et Courier. Le cache évite de recréer un élément DOM à chaque frappe.
  const px=Math.max(1,Number(size)||8),key=(fontFamilyName||'Helvetica')+'@'+px;
  const cache=browserBoxTextMetrics._cache||(browserBoxTextMetrics._cache=new Map());
  if(cache.has(key))return cache.get(key);
  let baseline=px*.82,lineHeight=px;
  let host=null;
  try{
    host=document.createElement('div');
    Object.assign(host.style,{position:'absolute',left:'-10000px',top:'0',visibility:'hidden',pointerEvents:'none',whiteSpace:'nowrap',padding:'0',margin:'0',border:'0',fontFamily:cssFont(fontFamilyName),fontSize:px+'px',lineHeight:'1'});
    host.appendChild(document.createTextNode('Mg'));
    const marker=document.createElement('span');
    Object.assign(marker.style,{display:'inline-block',width:'0',height:'0',padding:'0',margin:'0',border:'0',verticalAlign:'baseline'});
    host.appendChild(marker);document.body.appendChild(host);
    const hr=host.getBoundingClientRect(),mr=marker.getBoundingClientRect();
    const b=mr.top-hr.top;
    if(Number.isFinite(b)&&b>0&&b<px*1.5)baseline=b;
    if(Number.isFinite(hr.height)&&hr.height>0)lineHeight=hr.height;
  }catch(_e){}finally{host?.remove();}
  const out={baseline,lineHeight};cache.set(key,out);return out;
}
function browserBoxTextAscent(fontFamilyName,size){return browserBoxTextMetrics(fontFamilyName,size).baseline;}

async function exportDocument(){
  if(!pdfProxy||!window.PDFLib){setStatus('Unable to generate PDF: document or PDF library unavailable');return;}
  const suggestedName=(docName.replace(/\.pdf$/i,'')||'document')+'_edited.pdf';
  let saveHandle=null;
  let saveDirectory=null;

  // v91 : le sélecteur doit être appelé directement depuis le clic utilisateur,
  // avant la moindre génération asynchrone. showSaveFilePicker ouvre la vraie
  // fenêtre Enregistrer sous de Chromium/Windows.
  if(typeof window.showSaveFilePicker==='function'){
    try{
      saveHandle=await window.showSaveFilePicker({
        suggestedName,
        types:[{description:'Document PDF',accept:{'application/pdf':['.pdf']}}]
      });
    }catch(saveErr){
      if(saveErr&&saveErr.name==='AbortError'){setStatus('Save cancelled');return;}
      console.error('showSaveFilePicker:',saveErr);
      setStatus('Save As dialog refused: '+(saveErr.message||saveErr.name||'error'));
      return;
    }
  }else if(typeof window.showDirectoryPicker==='function'){
    // Secours : certains contextes PWA exposent le choix de dossier mais pas
    // showSaveFilePicker. On ouvre alors l'Explorateur pour choisir le dossier.
    try{
      saveDirectory=await window.showDirectoryPicker({mode:'readwrite'});
    }catch(saveErr){
      if(saveErr&&saveErr.name==='AbortError'){setStatus('Save cancelled');return;}
      console.error('showDirectoryPicker:',saveErr);
      setStatus('Folder selection refused: '+(saveErr.message||saveErr.name||'error'));
      return;
    }
  }else{
    const msg='This browser window does not provide the Save As API. The PDF will be downloaded. To get a file dialog each time, enable “Ask where to save each file before downloading” in Edge/Chrome download settings.';
    setStatus(msg);
    alert(msg);
  }
  collectCurrentPage();
  setStatus('Creating…');
  try{const doc=await PDFLib.PDFDocument.load(new Uint8Array(pdfBytes));const pages=doc.getPages();const fonts={Helvetica:await doc.embedFont(PDFLib.StandardFonts.Helvetica),TimesRoman:await doc.embedFont(PDFLib.StandardFonts.TimesRoman),Courier:await doc.embedFont(PDFLib.StandardFonts.Courier)};for(let i=0;i<pages.length;i++){const st=pageStates[i+1];if(!st)continue;const p=pages[i],W=p.getWidth(),H=p.getHeight();for(const m of st.masks||[])p.drawRectangle({x:m.x,y:H-m.y-m.h,width:m.w,height:m.h,color:PDFLib.rgb(1,1,1)});for(const f of st.fields||[]){const ff=f.fontFamily||'Helvetica',font=fonts[ff]||fonts.Helvetica,size=Number.isFinite(+f.fontSize)?Math.max(5,Math.min(48,+f.fontSize)):8,tc=hexToRgb01(f.textColor||'#000000'),yOffset=stateFieldYOffset(f);const raw=(f.value||'');const boxes=f.boxes||[];const t=boxes.length>=2?raw:raw.trim();if(!t&&!boxes.length)continue;if(boxes.length>=2){const chars=Array.from(raw.replace(/\r?\n/g,''));/* Même baseline qu'à l'écran, indépendante de la taille de police. */const fm=browserBoxTextMetrics(ff,size),baselineGap=1.5,screenBaseline=(autoLineOn&&Number.isFinite(+f.lineY))?((+f.lineY)-baselineGap+yOffset):(f.y+(f.h-fm.lineHeight)/2+fm.baseline+yOffset),y=H-screenBaseline;for(let bi=0;bi<Math.min(chars.length,boxes.length);bi++){const ch=chars[bi];if(/\s/.test(ch))continue;const bw=boxes[bi].w||10,cx=boxes[bi].x+bw/2,tw=font.widthOfTextAtSize(ch,size);p.drawText(ch,{x:cx-tw/2,y,size,font,color:PDFLib.rgb(tc.r,tc.g,tc.b)});}}else{const maxW=Math.max(1,f.w-4),lineH=size*1.2,maxLines=Math.max(1,Math.floor((f.h-2)/lineH));const lines=[];for(const para of t.split(/\r?\n/)){let line='';for(const word of para.split(/\s+/)){const test=line?line+' '+word:word;if(font.widthOfTextAtSize(test,size)<=maxW)line=test;else{if(line)lines.push(line);line=word;}}lines.push(line);}const cfm=browserBoxTextMetrics(ff,size),classicBaselineGap=1.5,classicScreenBaseline=(autoLineOn&&Number.isFinite(+f.lineY))?((+f.lineY)-classicBaselineGap+yOffset):(f.y+(f.h-cfm.lineHeight)/2+cfm.baseline+yOffset);let y=H-classicScreenBaseline;for(const line of lines.slice(0,maxLines)){if(line){const tw=font.widthOfTextAtSize(line,size),ta=(f.textAlign==='center'||f.textAlign==='right')?f.textAlign:'left';let tx=f.x+2;if(ta==='center')tx=f.x+Math.max(2,(f.w-tw)/2);else if(ta==='right')tx=f.x+Math.max(2,f.w-tw-2);p.drawText(line,{x:tx,y,size,font,color:PDFLib.rgb(tc.r,tc.g,tc.b)});}y-=lineH;}}}for(const c of st.checks||[]){const sz=Math.min(c.w||12,c.h||12),baseY=H-c.y-sz;if(!c.detected)p.drawRectangle({x:c.x,y:baseY,width:sz,height:sz,borderColor:PDFLib.rgb(0,0,0),borderWidth:0.8});if(c.checked){/* A l'export PDF, reproduire une vraie coche plutôt qu'une croix en X. Les coordonnées restent proportionnelles à la case, donc le rendu reste propre même sur les petites cases détectées. */const thick=Math.max(.65,Math.min(1.25,sz*.10)),x0=c.x+sz*.20,y0=baseY+sz*.49,x1=c.x+sz*.41,y1=baseY+sz*.27,x2=c.x+sz*.80,y2=baseY+sz*.72;p.drawLine({start:{x:x0,y:y0},end:{x:x1,y:y1},thickness:thick,color:PDFLib.rgb(0,0,0)});p.drawLine({start:{x:x1,y:y1},end:{x:x2,y:y2},thickness:thick,color:PDFLib.rgb(0,0,0)});}}for(const im of st.images||[]){const src=im.src||'';if(!src)continue;let emb;const raw=Uint8Array.from(atob((src.split(',')[1]||'')),c=>c.charCodeAt(0));if(src.startsWith('data:image/png'))emb=await doc.embedPng(raw);else if(src.startsWith('data:image/jpeg')||src.startsWith('data:image/jpg'))emb=await doc.embedJpg(raw);else{const ci=new Image();ci.src=src;await ci.decode();const c=document.createElement('canvas');c.width=ci.naturalWidth;c.height=ci.naturalHeight;c.getContext('2d').drawImage(ci,0,0);const png=c.toDataURL('image/png');const rb=Uint8Array.from(atob(png.split(',')[1]),x=>x.charCodeAt(0));emb=await doc.embedPng(rb);}p.drawImage(emb,{x:im.x,y:H-im.y-im.h,width:im.w,height:im.h});}}
const out=await doc.save(),blob=new Blob([out],{type:'application/pdf'});
if(saveHandle){
  const writable=await saveHandle.createWritable();
  await writable.write(blob);
  await writable.close();
  setStatus('PDF created: '+(saveHandle.name||suggestedName));
}else if(saveDirectory){
  const fileHandle=await saveDirectory.getFileHandle(suggestedName,{create:true});
  const writable=await fileHandle.createWritable();
  await writable.write(blob);
  await writable.close();
  setStatus('PDF created: '+suggestedName);
}else{
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=suggestedName;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);setStatus('PDF created (browser download)');
}
}catch(err){console.error(err);setStatus('Error: '+err.message);}}

// Dark Reader peut réécrire les styles après création du champ. On réaffirme
// uniquement la couleur du texte du PDF, sans toucher au thème de l'interface.

  if(darkReaderColorRefreshQueued)return;

// Robust PWA update handling: HTML and the service worker should not stay stuck
// on an old version after files are replaced on the local server.
if ('serviceWorker' in navigator) {
  let swRegistration = null;
  let reloadingForUpdate = false;
  const checkForPwaUpdate = async () => {
    try {
      if (swRegistration) await swRegistration.update();
      // Request version.json without cache so we can verify that the local server
      // is serving the current files.
      const r = await fetch('./version.json?t=' + Date.now(), {cache:'no-store'});
      if (r.ok) {
        const info = await r.json();
        if (info.version && String(info.version) !== APP_VERSION) {
          console.warn('Different server version:', info.version);
        }
      }
    } catch (err) { console.warn('PWA update', err); }
  };
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloadingForUpdate) return;
    reloadingForUpdate = true;
    location.reload();
  });
  window.addEventListener('load', async () => {
    try {
      // The version parameter forces Chromium to notice the new script immediately,
      // even if an older PWA version is still installed.
      swRegistration = await navigator.serviceWorker.register('./service-worker.js?v='+APP_VERSION, {scope:'./', updateViaCache:'none'});
      await checkForPwaUpdate();
      setInterval(checkForPwaUpdate, 60000);
    } catch (err) { console.warn('Service Worker', err); }
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForPwaUpdate(); });
  window.addEventListener('focus', checkForPwaUpdate);
  window.addEventListener('online', checkForPwaUpdate);
}

// Lorsqu'une PWA installée est choisie via « Ouvrir avec », Chromium transmet
// le PDF ici. On réutilise exactement le même chargeur que le bouton Ouvrir.
if ('launchQueue' in window && 'files' in LaunchParams.prototype) {
  launchQueue.setConsumer(async launchParams => {
    try {
      const handles = launchParams.files || [];
      if (!handles.length) return;
      const file = await handles[0].getFile();
      await openPicked(file);
    } catch (err) {
      console.error(err);
      setStatus('PWA open error: ' + (err?.message || err));
    }
  });
}
